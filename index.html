:root {
  --bg: #fff4f5; --surface: #fffcfa; --fg: #4a2c3a; --muted: #99727f; --line: #f4d8df;
  --accent: #e0658c; --accent-ink: #ffffff; --accent-soft: #fde0e8; --warn: #c2410c;
  --p0-bg: #fbd3dd; --p0-ink: #8a2f4d; --p1-bg: #e6d9fb; --p1-ink: #5b3f8a;
  --p2-bg: #d3e8fb; --p2-ink: #2f5b8a; --p3-bg: #fff0bf; --p3-ink: #755d12;
  --p4-bg: #d3f0e0; --p4-ink: #2f6b4c; --p5-bg: #ffdcc8; --p5-ink: #8a4a2a;
  --p6-bg: #fbdcee; --p6-ink: #8a2f6b; --p7-bg: #e2ecd0; --p7-ink: #52662a;
  --paper: #fffef6; --tape: rgba(244, 160, 190, .55); --tape2: rgba(190, 170, 240, .55); --tape3: rgba(160, 210, 240, .55);
  --shadow: 0 6px 16px rgba(160, 80, 110, .18);
  --display: "PP Display", Georgia, "Times New Roman", serif;
  --body: "PP Body", "Segoe UI", system-ui, -apple-system, "Noto Sans Arabic", Tahoma, sans-serif;
  --hand: "PP Hand", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
}
:root[data-theme="dark"] {
  --bg: #25171f; --surface: #321f2a; --fg: #fbe9ef; --muted: #c79aaa; --line: #4d3040;
  --accent: #f08fae; --accent-ink: #2a1420; --accent-soft: #4b2838; --warn: #fdba74;
  --p0-bg: #5a2a3a; --p0-ink: #ffd3df; --p1-bg: #43355f; --p1-ink: #e6d9fb;
  --p2-bg: #2c4560; --p2-ink: #d3e8fb; --p3-bg: #5a4d1e; --p3-ink: #fff0bf;
  --p4-bg: #2b5440; --p4-ink: #d3f0e0; --p5-bg: #5c3a29; --p5-ink: #ffdcc8;
  --p6-bg: #5a2c4b; --p6-ink: #fbdcee; --p7-bg: #404f2a; --p7-ink: #e2ecd0;
  --paper: #3d2832; --tape: rgba(240, 143, 174, .45); --tape2: rgba(180, 160, 240, .45); --tape3: rgba(140, 200, 240, .45);
  --shadow: 0 6px 16px rgba(0, 0, 0, .4);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { color-scheme: light; }
html[data-theme="dark"] { color-scheme: dark; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-weight: 500; font-size: 15px; line-height: 1.5;
  padding: 20px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px));
  background-image: radial-gradient(var(--line) 1.2px, transparent 1.2px); background-size: 22px 22px;
}
b, strong { font-weight: 700; }
.p0 { --bg-s: var(--p0-bg); --ink-s: var(--p0-ink); } .p1 { --bg-s: var(--p1-bg); --ink-s: var(--p1-ink); }
.p2 { --bg-s: var(--p2-bg); --ink-s: var(--p2-ink); } .p3 { --bg-s: var(--p3-bg); --ink-s: var(--p3-ink); }
.p4 { --bg-s: var(--p4-bg); --ink-s: var(--p4-ink); } .p5 { --bg-s: var(--p5-bg); --ink-s: var(--p5-ink); }
.p6 { --bg-s: var(--p6-bg); --ink-s: var(--p6-ink); } .p7 { --bg-s: var(--p7-bg); --ink-s: var(--p7-ink); }
.wrap { max-width: 1080px; margin: 0 auto; display: grid; gap: 18px; }
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
h1 { font-family: var(--display); font-style: italic; font-weight: 700; font-size: 34px; line-height: 1.1; margin: 0; color: var(--accent); }
.sub { font-family: var(--hand); font-weight: 700; font-size: 21px; color: var(--muted); line-height: 1.1; }
.theme-btn { border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 6px 14px; font: 700 13px var(--body); cursor: pointer; }
.shell { display: grid; grid-template-columns: 188px minmax(0, 1fr); gap: 20px; align-items: start; }
nav.rail { background: var(--surface); border: 1.5px solid var(--line); border-radius: 22px; padding: 12px; display: grid; gap: 4px; position: sticky; top: 12px; }
nav.rail .lbl { font: 700 11px var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 4px 10px 6px; }
nav.rail button { text-align: left; border: 0; background: transparent; color: var(--fg); font: 700 14px var(--body); padding: 9px 12px; border-radius: 14px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
nav.rail button:hover { background: var(--accent-soft); }
nav.rail button[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
nav.rail .n { font-size: 12px; opacity: .85; }
main { min-width: 0; display: grid; gap: 18px; }
#alerts { display: grid; gap: 10px; }
.card { background: var(--surface); border: 1.5px solid var(--line); border-radius: 22px; padding: 18px; min-width: 0; }
.card h2 { font-family: var(--display); font-style: italic; font-size: 22px; margin: 0 0 12px; font-weight: 700; }
.card h3 { font: 700 12px var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
.hello { background: var(--accent-soft); border-color: transparent; display: grid; gap: 4px; }

    if (!frame.last) frame.last = ts;
    var dt = Math.min(0.05, (ts - frame.last) / 1000); frame.last = ts;
    if (document.hidden || layer.hidden) return;
    if (!bubbleEl.hidden) { PT.bT -= dt * 1000; if (PT.bT <= 0) bubbleEl.hidden = true; }
    if (PT.st === "idle") {
      PT.next -= dt * 1000;
      if (PT.y < restY()) PT.y = reduce ? restY() : Math.min(restY(), PT.y + 560 * dt);
      if (PT.next <= 0) { if (reduce) PT.next = 8000; else chooseAction(); }
      else if (Math.random() < 0.004) { setFace("blink"); setTimeout(function () { if (PT.st === "idle") setFace("happy"); }, 140); }
    } else if (PT.st === "go") {
      var t = PT.tg ? PT.tg() : null;
      if (!t) toIdle();
      else {
        var arrived;
        if (reduce) { PT.x = t.x; PT.y = t.y; arrived = true; } else arrived = moveP(t.x, t.y, PT.sp, dt);
        if (arrived) { var f = PT.after; PT.after = null; if (f) f(); else toIdle(); }
      }
    } else if (PT.st === "kiss") {
      PT.t -= dt * 1000; PT.hT -= dt * 1000;
      if (PT.hT <= 0) { PT.hT = 520; heart(PT.x + psize() / 2 + PT.dir * psize() * 0.5, PT.y + psize() * 0.3); }
      if (PT.t <= 0) toIdle();
    } else if (PT.st === "sleep") {
      var s2 = PT.sleepGet ? PT.sleepGet() : null;
      if (!s2) toIdle(1500);
      else { PT.x = s2.x; PT.y = s2.y; PT.t -= dt * 1000; if (PT.t <= 0) { var g = PT.greet; PT.greet = false; say("*yawn*", 1800); toIdle(2500); if (g) setTimeout(function () { if (PT.st === "idle") sweetTalk(); }, 1900); } }
    } else if (PT.st === "trip") {
      if (PT.y < restY()) PT.y = Math.min(restY(), PT.y + 700 * dt);
      PT.t -= dt * 1000; if (PT.t <= 0) startCry();
    } else if (PT.st === "cry") {
      if (PT.y < restY()) PT.y = Math.min(restY(), PT.y + 700 * dt);
    } else if (PT.st === "forgive") {
      PT.t -= dt * 1000; if (PT.t <= 0) toIdle(2500);
    } else if (PT.st === "curse") {
      PT.t -= dt * 1000; if (PT.t <= 0) toIdle(3000);
    } else if (PT.st === "dance") {
      PT.t -= dt * 1000; PT.hT -= dt * 1000;
      if (PT.hT <= 0) { PT.hT = 500; PT.dir = -PT.dir; heart(PT.x + psize() / 2 + (Math.random() - 0.5) * psize(), PT.y + 4, pick(["♪", "♫"])); }
      if (PT.t <= 0) toIdle();
    } else if (PT.st === "snack") {
      PT.t -= dt * 1000; PT.hT -= dt * 1000;
      if (PT.hT <= 0) { PT.hT = 900; heart(PT.x + psize() / 2 + PT.dir * psize() * 0.3, PT.y + psize() * 0.4, "🥕"); }
      if (PT.t <= 0) { say("yummy ♡", 1500); toIdle(); }
    } else if (PT.st === "sail") {
      PT.t -= dt * 1000; PT.hT -= dt * 1000;
      if (PT.y < restY()) PT.y = Math.min(restY(), PT.y + 560 * dt);
      if (PT.t <= 0) { PT.t = 4200; say(SHANTY[PT.i++ % SHANTY.length], 4000); }
      if (PT.hT <= 0) { PT.hT = 650; heart(PT.x + psize() / 2 + (Math.random() - 0.5) * psize(), PT.y + 2, pick(["💋", "♡", "🌊"])); }
      if (reduce || moveP(PT.lx, restY(), 55, dt, true)) toIdle(3000);
    } else if (PT.st === "party") {
      PT.t -= dt * 1000; if (PT.t <= 0) toIdle(2500);
    } else if (PT.st === "lecture") {
      if (reduce) { PT.y = restY(); }
      else if (moveP(PT.lx, restY(), 400, dt, true)) PT.lx = PT.lx > window.innerWidth / 2 ? 10 : window.innerWidth - psize() - 10;
    }
    petEl.style.transform = "translate(" + PT.x.toFixed(1) + "px," + PT.y.toFixed(1) + "px)";
    flipEl.style.transform = PT.dir < 0 ? "scaleX(-1)" : "scaleX(1)";
    if (!bubbleEl.hidden) {
      bubbleEl.style.transform = "translateX(-50%)";
      var br = bubbleEl.getBoundingClientRect(), shift = 0;
      if (br.left < 6) shift = 6 - br.left; else if (br.right > window.innerWidth - 6) shift = window.innerWidth - 6 - br.right;
      if (shift) bubbleEl.style.transform = "translateX(calc(-50% + " + shift + "px))";
    }
  }
  function applyPet() {
    var on = !(S.pet && S.pet.on === false);
    layer.hidden = !on;
    if (on) { PT.y = restY(); PT.x = Math.min(PT.x, window.innerWidth - psize() - 10); toIdle(1500); }
  }
  window.addEventListener("resize", function () { PT.x = Math.max(0, Math.min(PT.x, window.innerWidth - psize() - 4)); if (PT.st === "idle") PT.y = restY(); });
  setFace("happy"); PT.y = restY(); applyPet();
  var lastAct = Date.now();
  ["pointerdown", "keydown", "scroll", "touchstart"].forEach(function (ev) { window.addEventListener(ev, wakeUp, { passive: true, capture: true }); });
  document.addEventListener("visibilitychange", function () { if (!document.hidden) lastAct = Date.now(); });
  if (!layer.hidden) startNap(3500, true);
  requestAnimationFrame(frame);
  setInterval(checkEvents, 1500);

  (function () { var st = stats(), d = iso(new Date()); if (st.days.indexOf(d) < 0) { st.days.push(d); if (st.days.length > 60) st.days.shift(); } checkQuests(); save(); })();
  applyTheme(); render(); tick();
  setInterval(tick, 15000);
  if (VIEW) {
    document.body.classList.add("viewonly");
    var pass = ""; try { pass = localStorage.getItem("petal-view-pass") || ""; } catch (e) {}
    if (!pass) pass = window.prompt("Passcode") || "";
    sbRpc("get_planner", { p_pass: pass }).then(function (r) {
      if (!r || !r.data) throw new Error("no access");
      try { localStorage.setItem("petal-view-pass", pass); } catch (e) {}
      if (r.data.off) { toast("Sharing is turned off."); return; }
      var base = seed(); S = r.data; for (var k in base) if (!(k in S)) S[k] = base[k];
      applyTheme(); render(); toast("View only · updated " + fmtStamp(new Date(r.at).getTime()));
    }).catch(function () { try { localStorage.removeItem("petal-view-pass"); } catch (e) {} toast("Couldn't load. Check the passcode and reload."); });
  } else {
    pushShare(true);
    window.addEventListener("online", function () { pushShare(true); });
  }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  loadPhotos();
  fetchNotes();
  window.addEventListener("online", fetchNotes);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) fetchNotes(); });
})();
</script>
